{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Gulbee Ledger</title>

    <!-- PWA Manifest -->
    <link
        rel="manifest"
        href="{% static 'manifest.json' %}"
    >

    <!-- Browser / PWA theme -->
    <meta
        name="theme-color"
        content="#2563eb"
    >

    <!-- Favicon -->
    <link
        rel="icon"
        type="image/png"
        href="{% static 'icons/favicon-32.png' %}"
    >

    <!-- Android -->
    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <!-- iOS -->
    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Gulbee Ledger"
    >

    {% block head %}
    {% endblock %}
</head>

<body>

    {% block content %}
    {% endblock %}


    <!-- Service Worker -->
    <script>
        if ("serviceWorker" in navigator) {

            window.addEventListener("load", function () {

                navigator.serviceWorker.register("/sw.js")
                    .then(function (registration) {

                        console.log(
                            "Gulbee Ledger Service Worker registered:",
                            registration.scope
                        );

                    })
                    .catch(function (error) {

                        console.error(
                            "Service Worker registration failed:",
                            error
                        );

                    });

            });

        }
    </script>


    {% block scripts %}
    {% endblock %}

</body>
</html>
